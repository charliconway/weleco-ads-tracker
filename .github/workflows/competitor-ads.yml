name: WelleCo Competitor Ads — Daily Scrape

on:
  schedule:
    - cron: '0 21 * * *'   # 7:00 AM AEST (UTC+10) every day
  workflow_dispatch:         # also allows manual "Run workflow" button in GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run scraper
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: python scraper.py

      - name: Commit updated seen_ad_ids.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ad_ids.json
          git diff --staged --quiet || git commit -m "chore: update seen_ad_ids [skip ci]"
          git push
